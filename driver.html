<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MazayaGo - Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #1e293b; color: white; display: flex; justify-content: center; margin: 0; }
        .app-container { width: 100%; height: 100vh; max-width: 480px; background-color: #0f172a; position: relative; display: flex; flex-direction: column; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="app-container p-4">
        
        <!-- Header Driver -->
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl mb-6 border border-slate-700 shadow-lg">
            <div>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sistem Operasional Driver</p>
                <h1 class="text-xl font-black text-[#ffb703] italic tracking-tight">MAZAYA<span class="text-white">GO</span></h1>
            </div>
            <div class="w-12 h-12 bg-green-500/20 rounded-full flex items-center justify-center border border-green-500/50 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                <div class="w-4 h-4 bg-green-500 rounded-full animate-ping absolute"></div>
                <div class="w-3 h-3 bg-green-500 rounded-full relative z-10"></div>
            </div>
        </div>

        <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><i class="bi bi-card-checklist text-[#ffb703]"></i> Tugas Aktif Saat Ini</h2>

        <!-- Card Tugas (Nantinya data ini ditarik otomatis dari Sheets, ini tampilan antarmukanya) -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 shadow-xl flex flex-col">
            
            <div class="flex justify-between items-start border-b border-slate-700 pb-4 mb-4">
                <div>
                    <p class="text-xs text-slate-400 mb-0.5">Pemesan / Pelanggan</p>
                    <p class="font-bold text-white text-lg">Bpk. Budi Santoso</p>
                    <p class="text-xs font-mono text-blue-400 mt-1" id="orderIdTarget">MZY-1234</p>
                </div>
                <!-- Tombol Telepon Otomatis -->
                <a href="tel:0812345678" class="w-12 h-12 bg-green-600 hover:bg-green-500 rounded-full flex items-center justify-center shadow-lg transition-colors"><i class="bi bi-telephone-fill text-xl"></i></a>
            </div>

            <div class="space-y-5 mb-8 flex-1">
                <div class="flex gap-4 items-start">
                    <div class="mt-1 w-8 h-8 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center shrink-0 border border-blue-500/30"><i class="bi bi-geo-alt-fill"></i></div>
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider">Titik Jemput</p>
                        <p class="text-sm font-bold leading-snug mt-0.5">Jl. Ahmad Yani No. 15, Jember</p>
                    </div>
                </div>
                <div class="flex gap-4 items-start">
                    <div class="mt-1 w-8 h-8 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center shrink-0 border border-red-500/30"><i class="bi bi-flag-fill"></i></div>
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider">Tujuan Bongkar</p>
                        <p class="text-sm font-bold leading-snug mt-0.5">Perumahan Mastrip Blok A2</p>
                    </div>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider">Sistem Layanan</p>
                        <p class="text-sm font-bold text-white">Reguler (Dalam Kota)</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider">Total Tagihan</p>
                        <p class="text-xl font-black text-green-400">Rp 75.000</p>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi Lapangan (Tersambung ke Google Sheets) -->
            <div class="space-y-3 mt-auto">
                <button onclick="kirimStatusKeSheets('Driver Menuju Lokasi')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 text-sm">
                    <i class="bi bi-cursor-fill text-lg"></i> MELUNCUR KE LOKASI
                </button>
                <button onclick="kirimStatusKeSheets('Barang Diangkut')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 text-sm">
                    <i class="bi bi-box-seam text-lg"></i> BARANG DIANGKUT (JALAN)
                </button>
                <button onclick="kirimStatusKeSheets('Selesai')" class="w-full bg-[#00B14F] hover:bg-green-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 text-sm border border-green-400/50">
                    <i class="bi bi-check-circle-fill text-lg"></i> TUGAS SELESAI
                </button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // WAJIB GANTI: Masukkan Link Web App Google Apps Script Bapak di bawah ini!
        // =========================================================================
        const GAS_URL = 'URL_APPS_SCRIPT_BAPAK_DI_SINI'; 
        
        // Simulasi ID Order yang sedang dipegang sopir
        // (Di sistem yang lebih maju, ini ditarik otomatis dari database)
        let currentOrderId = document.getElementById('orderIdTarget').innerText;

        // Fungsi Utama untuk merubah status langsung ke Excel / Google Sheets
        async function kirimStatusKeSheets(statusBaru) {
            
            // Konfirmasi keamanan agar tidak kepencet
            const { isConfirmed } = await Swal.fire({
                title: 'Konfirmasi Aksi',
                text: `Ubah status pesanan menjadi "${statusBaru}"?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#475569',
                confirmButtonText: 'Ya, Ubah Status!',
                cancelButtonText: 'Batal',
                background: '#1e293b', 
                color: 'white'
            });

            if (!isConfirmed) return;

            // Memunculkan Loading agar sopir tahu sistem sedang bekerja
            Swal.fire({
                title: 'Menghubungkan ke Server...',
                text: 'Mohon tunggu sebentar.',
                background: '#1e293b', 
                color: 'white',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                // Proses pengiriman data ke Code.gs (Google Sheets)
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateStatus',
                        payload: {
                            id: currentOrderId,
                            status: statusBaru
                        }
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    Swal.fire({
                        icon: 'success', 
                        title: 'Status Berhasil Diperbarui!', 
                        text: `Pelanggan sekarang melihat status: "${statusBaru}"`,
                        confirmButtonColor: '#00B14F', 
                        background: '#1e293b', 
                        color: 'white'
                    });
                } else {
                    throw new Error('Gagal merespon dari server');
                }

            } catch (error) {
                // Jika gagal (misal tidak ada sinyal atau URL belum diganti)
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Terhubung!',
                    text: 'Pastikan sinyal internet stabil dan URL sistem sudah benar.',
                    confirmButtonColor: '#ef4444', 
                    background: '#1e293b', 
                    color: 'white'
                });
            }
        }
    </script>
</body>
</html>
