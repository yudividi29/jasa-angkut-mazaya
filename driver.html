<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MazayaGo - Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #1e293b; color: white; display: flex; justify-content: center; }</style>
</head>
<body class="m-0 h-screen w-full">

    <div class="w-full h-full max-w-md bg-[#0f172a] p-5 flex flex-col mx-auto">
        <div class="bg-slate-800 p-4 rounded-2xl mb-6 border border-slate-700 flex justify-between items-center">
            <div><p class="text-[10px] text-slate-400">Panel Operasional</p><h1 class="text-xl font-black text-[#ffb703] italic">MAZAYA<span class="text-white">GO</span></h1></div>
            <div class="w-10 h-10 bg-green-500/20 rounded-full flex items-center justify-center border border-green-500/50"><div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div></div>
        </div>

        <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 flex flex-col">
            <label class="block text-xs font-bold text-slate-400 mb-2">ID Pesanan (Contoh: MZY-2026...)</label>
            <input type="text" id="orderId" class="w-full bg-slate-900 border border-slate-600 text-white p-4 rounded-xl outline-none font-mono mb-8" placeholder="Ketik ID...">

            <div class="space-y-4 mt-auto">
                <button onclick="kirim('Driver Menuju Lokasi')" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl flex justify-center items-center gap-2"><i class="bi bi-cursor-fill"></i> MELUNCUR KE LOKASI</button>
                <button onclick="kirim('Barang Diangkut')" class="w-full bg-amber-500 text-slate-900 font-black py-4 rounded-xl flex justify-center items-center gap-2"><i class="bi bi-box-seam"></i> BARANG DIANGKUT (JALAN)</button>
                <button onclick="kirim('Selesai')" class="w-full bg-[#00B14F] text-white font-black py-4 rounded-xl flex justify-center items-center gap-2"><i class="bi bi-check-circle-fill"></i> TUGAS SELESAI</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsfSksKTUHNsbFR2wSDZRTynjyuhd_HPYOcb6-V8VbEAwWoyYOj9rdrFZAeROUa_LEGw/exec'; 

        async function kirim(status) {
            let id = document.getElementById('orderId').value.trim();
            if(!id) return Swal.fire({ icon:'warning', title:'Kosong!', text:'Isi ID Pesanan dulu.', background:'#1e293b', color:'white' });
            if(!(await Swal.fire({title:'Yakin?', text:`Ubah jadi "${status}"?`, showCancelButton:true, background:'#1e293b', color:'white'})).isConfirmed) return;
            
            Swal.fire({title:'Menyimpan...', background:'#1e293b', color:'white', didOpen:()=>Swal.showLoading()});
            let res = await fetch(GAS_URL, {method:'POST', body:JSON.stringify({action:'updateStatus', payload:{id:id, status:status}})}).then(r=>r.json());
            if(res.status==='success') Swal.fire({icon:'success', title:'Berhasil', background:'#1e293b', color:'white'});
            else Swal.fire({icon:'error', title:'Gagal', text:'ID tidak ditemukan.', background:'#1e293b', color:'white'});
        }
    </script>
</body>
</html>
