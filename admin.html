<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Kontrol - Mazaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .sidebar { background: #0f172a; transition: all 0.3s; }
        .nav-link { transition: 0.2s; border-radius: 0.5rem; color: #94a3b8; padding: 0.875rem 1rem; display: flex; align-items: center; gap: 0.75rem; font-weight: 500; margin-bottom: 0.5rem; }
        .nav-link:hover { background: #1e293b; color: #f8fafc; }
        .nav-link.active { background: #3b82f6; color: white; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5); }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        /* Scrollbar kustom untuk tabel */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="sidebar w-64 flex-shrink-0 hidden md:flex flex-col h-full z-20">
        <div class="p-6 flex items-center gap-3 border-b border-slate-700/50">
            <div class="bg-blue-500 text-white p-2 rounded-lg shadow-lg">
                <i class="bi bi-truck text-xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white tracking-wide">MAZAYA</h2>
                <p class="text-[10px] text-slate-400 font-medium tracking-wider">ADMIN DASHBOARD</p>
            </div>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto">
            <p class="text-xs font-semibold text-slate-500 mb-4 px-2 uppercase tracking-wider">Menu Utama</p>
            <nav id="navMenu">
                <a href="#" onclick="showSection('pesanan', this)" class="nav-link active"><i class="bi bi-list-task text-lg"></i> Data Pesanan</a>
                <a href="#" onclick="showSection('pelanggan', this)" class="nav-link"><i class="bi bi-people text-lg"></i> Data Pelanggan</a>
                <a href="#" onclick="showSection('armada', this)" class="nav-link"><i class="bi bi-car-front text-lg"></i> Data Armada</a>
                <a href="#" onclick="showSection('kru', this)" class="nav-link"><i class="bi bi-person-vcard text-lg"></i> Data Kru</a>
                <a href="#" onclick="showSection('finansial', this)" class="nav-link"><i class="bi bi-wallet2 text-lg"></i> Finansial</a>
            </nav>
        </div>
        
        <div class="p-4 border-t border-slate-700/50">
            <button onclick="sinkronData()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg transition text-sm font-medium">
                <i class="bi bi-arrow-clockwise"></i> Refresh Data
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50">
        
        <!-- Header Mobile (Tampil saat di HP) -->
        <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between z-10 shadow-sm">
            <div class="flex items-center gap-2">
                <i class="bi bi-truck text-blue-500 text-xl"></i>
                <span class="font-bold text-slate-800">MAZAYA</span>
            </div>
            <button class="text-slate-500 text-2xl" onclick="alert('Gunakan perangkat layar besar (Laptop/PC) untuk pengalaman Admin terbaik.')">
                <i class="bi bi-list"></i>
            </button>
        </header>

        <!-- Header Halaman -->
        <header class="bg-white px-8 py-5 border-b border-slate-200 z-10 flex items-center justify-between shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 capitalize" id="pageTitle">Data Pesanan</h1>
                <p class="text-sm text-slate-500 mt-1" id="pageSubtitle">Manajemen dan pemantauan order aktif.</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="statusKoneksi" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-bold flex items-center gap-2 border border-yellow-200">
                    <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span></span>
                    Menghubungkan...
                </span>
            </div>
        </header>

        <!-- Area Data (Berubah-ubah sesuai menu) -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8" id="containerData">
            <!-- Loading State -->
            <div class="flex flex-col items-center justify-center h-64">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
                <p class="text-slate-500 font-medium">Sedang memuat data dari database...</p>
            </div>
        </main>
    </div>

    <script>
        // URL DATABASE GOOGLE APPS SCRIPT ANDA (YANG PALING BARU)
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyFAS7hUgpxO7buBN3hrkt3Xe9A6efeDtevZbbDaSGZvgyXTVZMk7aMOyiTYD8jfEfH9g/exec';
        
        let globalData = { pesanan: [], pelanggan: [], armada: [], kru: [] };
        let currentSection = 'pesanan';

        // Fungsi saat halaman pertama kali dimuat
        window.onload = () => {
            sinkronData();
        };

        // Fungsi mengambil data dari Excel
        async function sinkronData() {
            const statusEl = document.getElementById('statusKoneksi');
            statusEl.innerHTML = `<span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span></span> Sinkronisasi...`;
            statusEl.className = "px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold flex items-center gap-2 border border-blue-200 shadow-sm";

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                if (data.status === 'success') {
                    globalData = data;
                    statusEl.innerHTML = `<i class="bi bi-check-circle-fill"></i> Terhubung`;
                    statusEl.className = "px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold flex items-center gap-1.5 border border-emerald-200 shadow-sm";
                    renderCurrentSection();
                } else {
                    throw new Error("Format data tidak sesuai");
                }
            } catch (error) {
                console.error("Gagal load data:", error);
                statusEl.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> Gagal Muat`;
                statusEl.className = "px-3 py-1 bg-red-50 text-red-600 rounded-full text-xs font-bold flex items-center gap-1.5 border border-red-200 shadow-sm cursor-pointer";
                statusEl.onclick = sinkronData;
                
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Terputus',
                    text: 'Gagal mengambil data dari Google Spreadsheet. Coba refresh kembali.',
                    confirmButtonColor: '#3b82f6'
                });
            }
        }

        // Fungsi ganti menu
        function showSection(section, element = null) {
            currentSection = section;
            
            // Update UI Menu Aktif
            if(element) {
                document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }
            
            // Update Judul
            const titleMap = {
                'pesanan': { t: 'Data Pesanan', s: 'Manajemen dan pemantauan order aktif.' },
                'pelanggan': { t: 'Data Pelanggan', s: 'Daftar riwayat kontak pelanggan Anda.' },
                'armada': { t: 'Data Armada', s: 'Monitoring status kesiapan kendaraan.' },
                'kru': { t: 'Data Kru', s: 'Manajemen Sopir dan Helper/Kernet.' },
                'finansial': { t: 'Finansial & Keuangan', s: 'Rekapitulasi pendapatan dan pengeluaran.' }
            };
            document.getElementById('pageTitle').innerText = titleMap[section].t;
            document.getElementById('pageSubtitle').innerText = titleMap[section].s;
            
            renderCurrentSection();
        }

        // Fungsi penyalur render
        function renderCurrentSection() {
            const container = document.getElementById('containerData');
            container.innerHTML = ''; // Kosongkan layar
            
            if (currentSection === 'pesanan') renderPesanan(container);
            else if (currentSection === 'pelanggan') renderPelanggan(container);
            else if (currentSection === 'armada') renderArmada(container);
            else if (currentSection === 'kru') renderKru(container);
            else if (currentSection === 'finansial') renderFinansial(container);
        }

        function renderPesanan(container) {
            const dataSheet = globalData.pesanan || [];
            if (dataSheet.length <= 1) {
                container.innerHTML = `<div class="bg-white rounded-xl p-10 text-center border border-dashed border-slate-300"><i class="bi bi-inbox text-4xl text-slate-300 mb-3 block"></i><p class="text-slate-500">Belum ada data pesanan.</p></div>`;
                return;
            }

            let html = `<div class="grid gap-5">`;
            // Looping dari bawah (data terbaru di atas), i=0 adalah header/judul kolom jadi dilewati
            for (let i = dataSheet.length - 1; i > 0; i--) {
                const row = dataSheet[i];
                if (!row[0]) continue; // Lewati baris kosong
                
                // Indeks Kolom: 0:ID, 1:Tgl, 2:Nama, 3:WA, 4:Jemput, 5:Tujuan, 6:Jarak, 7:Waktu, 8:Berat, 9:Dimensi, 10:Ket, 11:Foto, 12:Total, 13:Status, 14:Bayar
                
                const idOrder = row[0]; const tgl = new Date(row[1]).toLocaleString('id-ID');
                const nama = row[2]; const hp = row[3];
                const rute = `Jemput: ${row[4]} <br> Tujuan: ${row[5]}`;
                const muatan = `${row[10]} (Berat: ${row[8]}Kg)`;
                const total = parseInt(row[12] || 0).toLocaleString('id-ID');
                
                // Logika Foto
                let fotoHtml = `<span class="text-xs text-slate-400 italic">Tidak ada foto</span>`;
                if (row[11] && row[11].includes("http")) {
                    fotoHtml = `<a href="${row[11]}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-lg text-xs font-bold transition duration-200 border border-blue-200"><i class="bi bi-image"></i> Lihat Foto Barang</a>`;
                }

                // Warna Status Order
                let statusOrder = row[13] || 'MENUNGGU';
                let colorOrder = statusOrder.includes('PROSES') ? 'bg-blue-100 text-blue-700' : (statusOrder.includes('SELESAI') ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-700');
                
                html += `
                <div class="bg-white rounded-xl card-shadow border border-slate-200 p-5 hover:border-blue-300 transition duration-300">
                    <div class="flex flex-col md:flex-row justify-between gap-4">
                        
                        <!-- Info Order -->
                        <div class="md:w-1/3 border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-4">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-lg">${nama}</h3>
                                    <p class="text-[10px] text-slate-400 font-mono">${idOrder} &bull; ${tgl}</p>
                                </div>
                                <span class="px-2.5 py-1 rounded-md text-[10px] font-black tracking-wide uppercase ${colorOrder}">${statusOrder}</span>
                            </div>
                            <div class="mt-3 flex items-center gap-2 text-sm">
                                <a href="https://wa.me/62${hp.replace(/^0/,'')}" target="_blank" class="text-emerald-600 font-medium hover:underline bg-emerald-50 px-2 py-1 rounded"><i class="bi bi-whatsapp"></i> ${hp}</a>
                            </div>
                            <div class="mt-4 pt-4 border-t border-dashed border-slate-100">
                                ${fotoHtml}
                            </div>
                        </div>

                        <!-- Info Rute & Barang -->
                        <div class="md:w-1/3 border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-4 md:pl-2 text-sm text-slate-600 space-y-3">
                            <div><span class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-wider">Rute Perjalanan</span> <p class="leading-relaxed bg-slate-50 p-2 rounded border border-slate-100">${rute}</p></div>
                            <div><span class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-wider">Detail Muatan</span> <p class="font-medium">${muatan}</p></div>
                        </div>

                        <!-- Info Harga & Operasional -->
                        <div class="md:w-1/3 md:pl-2 flex flex-col justify-between space-y-4">
                            <div>
                                <span class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-wider">Estimasi Pendapatan</span>
                                <p class="text-xl font-black text-slate-800">Rp ${total}</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs text-slate-500 space-y-1.5">
                                <div class="flex justify-between"><span class="font-medium">Pembayaran:</span> <span class="font-bold ${row[14] === 'LUNAS' ? 'text-emerald-600' : 'text-red-500'}">${row[14] || 'BELUM LUNAS'}</span></div>
                                <div class="flex justify-between"><span class="font-medium">Jarak/Waktu:</span> <span class="font-bold text-slate-700">${row[6]} Km / ${row[7]}</span></div>
                            </div>
                        </div>

                    </div>
                </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderArmada(container) {
            const dataSheet = globalData.armada || [];
            let html = `
            <div class="mb-6 flex justify-between items-center">
                <p class="text-sm text-slate-500">Status kesiapan operasional kendaraan Anda.</p>
                <button onclick="tambahArmada()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2">
                    <i class="bi bi-plus-lg"></i> Register Armada
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">`;
            
            if(dataSheet.length <= 1) { html += `<div class="col-span-full p-8 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">Data armada belum ditambahkan.</div>`; }
            
            for (let i = 1; i < dataSheet.length; i++) {
                const row = dataSheet[i];
                if (!row[0]) continue;
                
                let status = row[3] || 'Ready';
                let stColor = status === 'Ready' ? 'bg-emerald-100 text-emerald-700' : (status === 'Di Bengkel' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700');

                html += `
                <div class="bg-white rounded-xl border border-slate-200 card-shadow p-5 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-16 h-16 bg-slate-50 rounded-bl-full -z-10 group-hover:bg-blue-50 transition"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-slate-100 text-slate-600 w-12 h-12 rounded-lg flex items-center justify-center text-2xl border border-slate-200"><i class="bi bi-truck"></i></div>
                        <span class="px-2 py-1 text-[10px] font-bold rounded-md ${stColor} uppercase tracking-wider">${status}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">${row[1]}</h3> <!-- Jenis Mobil -->
                    <p class="text-sm font-mono font-medium text-slate-500 bg-slate-50 inline-block px-2 py-1 border border-slate-100 rounded mt-2">${row[2]}</p> <!-- Plat -->
                </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderKru(container) {
            const dataSheet = globalData.kru || [];
            let html = `
            <div class="mb-6 flex justify-between items-center">
                <p class="text-sm text-slate-500">Daftar anggota Sopir dan Helper/Kernet.</p>
                <button onclick="tambahKru()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2">
                    <i class="bi bi-person-plus-fill"></i> Tambah Kru
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">`;

            if(dataSheet.length <= 1) { html += `<div class="col-span-full p-8 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">Data kru belum ditambahkan.</div>`; }

            for (let i = 1; i < dataSheet.length; i++) {
                const row = dataSheet[i];
                if (!row[0]) continue;

                let posisi = row[2] || 'Sopir';
                let icon = posisi === 'Sopir' ? 'bi-person-vcard' : 'bi-person-arms-up';

                html += `
                <div class="bg-white rounded-xl border border-slate-200 card-shadow p-4 flex items-center gap-4">
                    <div class="bg-blue-50 text-blue-600 w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0"><i class="bi ${icon}"></i></div>
                    <div class="min-w-0">
                        <h4 class="font-bold text-slate-800 truncate">${row[1]}</h4>
                        <p class="text-xs text-slate-500 font-medium">${posisi}</p>
                        <p class="text-xs text-slate-400 mt-1 truncate"><i class="bi bi-telephone"></i> ${row[3] || '-'}</p>
                    </div>
                </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function tambahArmada() {
            Swal.fire({
                title: 'Register Armada Baru',
                html: `
                    <input id="swal-jenis" class="swal2-input text-sm" placeholder="Jenis (Cth: L300 Box, Engkel)">
                    <input id="swal-plat" class="swal2-input text-sm font-mono uppercase" placeholder="Plat (Cth: P 1234 XY)">
                    <select id="swal-status" class="swal2-select text-sm"><option value="Ready">Ready / Siap</option><option value="Di Bengkel">Di Bengkel / Rusak</option><option value="Offline">Offline / Parkir</option></select>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                cancelButtonText: 'Batal',
                preConfirm: () => {
                    return {
                        id: 'ARM-' + Math.floor(Math.random()*9000),
                        jenis: document.getElementById('swal-jenis').value,
                        plat: document.getElementById('swal-plat').value.toUpperCase(),
                        status: document.getElementById('swal-status').value
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    kirimDataBaru('addArmada', result.value);
                }
            });
        }

        function tambahKru() {
            Swal.fire({
                title: 'Tambah Anggota Kru',
                html: `
                    <input id="swal-nama" class="swal2-input text-sm" placeholder="Nama Lengkap">
                    <select id="swal-posisi" class="swal2-select text-sm"><option value="Sopir">Sopir</option><option value="Helper/Kernet">Helper / Kernet</option></select>
                    <input id="swal-hp" type="tel" class="swal2-input text-sm" placeholder="No HP/WA">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                cancelButtonText: 'Batal',
                preConfirm: () => {
                    return {
                        id: 'KRU-' + Math.floor(Math.random()*9000),
                        nama: document.getElementById('swal-nama').value,
                        posisi: document.getElementById('swal-posisi').value,
                        hp: document.getElementById('swal-hp').value,
                        status: 'Aktif'
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    kirimDataBaru('addKru', result.value);
                }
            });
        }

        async function kirimDataBaru(actionType, payloadData) {
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                // Di sini kita gunakan mode no-cors karena GAS default tidak merespon balasan dengan header CORS penuh jika hanya appendRow
                await fetch(GAS_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: actionType, payload: payloadData })
                });
                
                Swal.fire({ icon: 'success', title: 'Berhasil Disimpan!', timer: 1500, showConfirmButton: false });
                setTimeout(sinkronData, 1600); // Tarik ulang data dari server
            } catch (err) {
                Swal.fire('Gagal Menyimpan', 'Terjadi kesalahan sistem', 'error');
            }
        }

        function renderPelanggan(container) {
            const dataSheet = globalData.pelanggan || [];
            let html = `
            <div class="mb-6 flex justify-between items-center">
                <p class="text-sm text-slate-500">Daftar riwayat kontak dan database pelanggan Anda.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-5">`;

            if(dataSheet.length <= 1) { 
                html += `<div class="col-span-full p-8 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">Data pelanggan belum tersedia di database.</div>`; 
            } else {
                // Looping data pelanggan (melewati baris 0 / judul kolom)
                for (let i = 1; i < dataSheet.length; i++) {
                    const row = dataSheet[i];
                    if (!row[0] && !row[1]) continue;

                    // Asumsi Kolom Excel: B(1)=Nama, C(2)=WA, D(3)=Alamat/Ket
                    const nama = row[1] || 'Tanpa Nama';
                    const wa = row[2] || '-';
                    const keterangan = row[3] || 'Pelanggan Jasa Angkut';
                    const inisial = nama.charAt(0).toUpperCase();

                    html += `
                    <div class="bg-white rounded-xl border border-slate-200 card-shadow p-5 flex flex-col justify-between hover:border-blue-300 transition duration-300">
                        <div class="flex items-start gap-4 mb-4">
                            <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0 font-bold shadow-md">
                                ${inisial}
                            </div>
                            <div class="min-w-0 flex-1">
                                <h4 class="font-bold text-slate-800 truncate text-lg">${nama}</h4>
                                <p class="text-xs text-slate-500 mt-0.5 line-clamp-2">${keterangan}</p>
                            </div>
                        </div>
                        <div class="border-t border-slate-100 pt-3 mt-auto">
                            <a href="https://wa.me/62${wa.toString().replace(/^0/,'')}" target="_blank" class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white rounded-lg text-sm font-bold transition duration-200">
                                <i class="bi bi-whatsapp"></i> Hubungi WA
                            </a>
                        </div>
                    </div>`;
                }
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderFinansial(container) {
            container.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 card-shadow p-8 text-center max-w-2xl mx-auto mt-10">
                <i class="bi bi-wallet2 text-6xl text-emerald-200 mb-4 block"></i>
