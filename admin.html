<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Admin - MazayaGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-[#0b192c] w-64 md:w-72 h-full flex flex-col transition-transform duration-300 absolute md:relative z-50 -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
        <div class="p-6 border-b border-white/10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic tracking-tight text-white">MAZAYA<span class="text-[#ffb703]">GO</span></h1>
                <p class="text-xs text-slate-400 mt-1">Control Panel v4.0 Pro</p>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="bi bi-x-lg text-xl"></i></button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="switchTab('pesanan')" id="btn-pesanan" class="w-full flex items-center gap-3 px-4 py-3 bg-white/10 text-white rounded-xl font-bold transition">
                <i class="bi bi-bell"></i> Pesanan Masuk
            </button>
            <button onclick="switchTab('keuangan')" id="btn-keuangan" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-white/5 hover:text-white rounded-xl font-bold transition">
                <i class="bi bi-wallet2"></i> Finansial & Omset
            </button>
            <button onclick="switchTab('pelanggan')" id="btn-pelanggan" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-white/5 hover:text-white rounded-xl font-bold transition">
                <i class="bi bi-people"></i> Data Pelanggan
            </button>
            <button onclick="switchTab('database')" id="btn-database" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-white/5 hover:text-white rounded-xl font-bold transition">
                <i class="bi bi-server"></i> Database Master
            </button>
            <button onclick="switchTab('pengaturan')" id="btn-pengaturan" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-white/5 hover:text-white rounded-xl font-bold transition">
                <i class="bi bi-gear"></i> Pengaturan
            </button>
        </nav>
        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 text-slate-400 text-sm">
                <i class="bi bi-person-circle text-2xl"></i>
                <div><p class="font-bold text-white">Admin Utama</p><p class="text-xs">Aktif</p></div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        <header class="bg-white p-4 shadow-sm z-10 flex items-center gap-4 border-b border-slate-200">
            <button onclick="toggleSidebar()" class="md:hidden text-slate-600 bg-slate-100 p-2 rounded-lg"><i class="bi bi-list text-xl"></i></button>
            <h2 class="text-lg md:text-xl font-black text-slate-800 flex-1" id="headerTitle">Daftar Pesanan Live</h2>
            <button onclick="muatDataPesanan()" class="flex items-center gap-2 bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-bold hover:bg-blue-100 transition shadow-sm text-sm border border-blue-100">
                <i class="bi bi-arrow-clockwise"></i> <span class="hidden sm:inline">Refresh</span>
            </button>
        </header>

        <!-- TAB PESANAN -->
        <div id="tab-pesanan" class="flex-1 overflow-y-auto p-4 bg-slate-50">
            <div id="loadingData" class="flex flex-col items-center justify-center py-20">
                <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                <p class="text-slate-500 font-bold animate-pulse">Memuat Data...</p>
            </div>
            <div id="pesananKosong" class="hidden text-center py-20">
                <i class="bi bi-box-seam text-5xl text-slate-300"></i>
                <h3 class="text-xl font-bold text-slate-700 mt-4">Belum Ada Pesanan</h3>
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-4" id="daftarPesanan"></div>
        </div>

        <!-- TAB KEUANGAN -->
        <div id="tab-keuangan" class="flex-1 overflow-y-auto p-4 md:p-6 hidden bg-slate-50">
            <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gradient-to-br from-green-500 to-emerald-700 p-6 rounded-2xl shadow-lg text-white flex flex-col justify-center">
                    <p class="text-green-100 font-bold text-sm mb-1">Total Omset Pendapatan</p>
                    <h2 class="text-4xl md:text-5xl font-black mb-6" id="totalPendapatan">Rp 0</h2>
                    <div class="bg-white/20 px-4 py-2.5 rounded-xl inline-flex gap-2 text-sm font-bold border border-white/30">
                        <i class="bi bi-check-circle-fill text-green-200"></i> <span id="totalOrderSelesai">0 Pesanan Selesai</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[400px]">
                    <h3 class="font-black text-slate-800 border-b border-slate-100 pb-3 mb-3"><i class="bi bi-clock-history text-green-500"></i> Riwayat Transaksi Selesai</h3>
                    <div class="overflow-y-auto flex-1 pr-2 space-y-2" id="listRiwayatKeuangan"></div>
                </div>
            </div>
        </div>

        <!-- TAB PELANGGAN -->
        <div id="tab-pelanggan" class="flex-1 overflow-y-auto p-4 md:p-6 hidden bg-slate-50">
            <div class="max-w-5xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-black text-slate-800 border-b border-slate-100 pb-4 mb-4"><i class="bi bi-people-fill text-blue-500"></i> Direktori Pelanggan</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="listPelanggan"></div>
            </div>
        </div>

        <!-- TAB DATABASE (SOPIR, KRU, ARMADA) -->
        <div id="tab-database" class="flex-1 overflow-y-auto p-4 hidden bg-slate-50">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-full">
                <!-- Sopir -->
                <div class="bg-white rounded-2xl border border-slate-200 flex flex-col h-full overflow-hidden">
                    <div class="p-4 bg-slate-50 flex justify-between border-b">
                        <h3 class="font-black"><i class="bi bi-person-badge text-blue-500"></i> Sopir</h3>
                        <button onclick="tambahData('Data_Sopir')" class="bg-blue-600 text-white text-xs font-black px-3 py-1 rounded-lg">Tambah</button>
                    </div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-2" id="listSopir"></div>
                </div>
                <!-- Kru -->
                <div class="bg-white rounded-2xl border border-slate-200 flex flex-col h-full overflow-hidden">
                    <div class="p-4 bg-slate-50 flex justify-between border-b">
                        <h3 class="font-black"><i class="bi bi-person-arms-up text-amber-500"></i> Kru</h3>
                        <button onclick="tambahData('Data_Kru')" class="bg-amber-500 text-white text-xs font-black px-3 py-1 rounded-lg">Tambah</button>
                    </div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-2" id="listKru"></div>
                </div>
                <!-- Armada -->
                <div class="bg-white rounded-2xl border border-slate-200 flex flex-col h-full overflow-hidden">
                    <div class="p-4 bg-slate-50 flex justify-between border-b">
                        <h3 class="font-black"><i class="bi bi-truck-front text-green-500"></i> Armada</h3>
                        <button onclick="tambahData('Data_Armada')" class="bg-green-600 text-white text-xs font-black px-3 py-1 rounded-lg">Tambah</button>
                    </div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-2" id="listArmada"></div>
                </div>
            </div>
        </div>

        <div id="tab-pengaturan" class="flex-1 hidden bg-slate-50 flex items-center justify-center text-slate-400 font-bold">Fitur Sedang Dikembangkan</div>
    </main>

    <script>
        // LINK APPS SCRIPT BAPAK YUDI
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsfSksKTUHNsbFR2wSDZRTynjyuhd_HPYOcb6-V8VbEAwWoyYOj9rdrFZAeROUa_LEGw/exec'; 

        let globalSopir = [], globalKru = [], globalArmada = [], globalPesanan = [];

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        function switchTab(tab) {
            ['pesanan', 'keuangan', 'pelanggan', 'pengaturan', 'database'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).classList.replace('bg-white/10', 'hover:bg-white/5');
                document.getElementById('btn-' + t).classList.replace('text-white', 'text-slate-400');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).classList.replace('hover:bg-white/5', 'bg-white/10');
            document.getElementById('btn-' + tab).classList.replace('text-slate-400', 'text-white');
            if(window.innerWidth < 768) toggleSidebar();
        }

        async function muatDataPesanan() {
            document.getElementById('loadingData').classList.remove('hidden');
            document.getElementById('daftarPesanan').innerHTML = '';
            document.getElementById('pesananKosong').classList.add('hidden');

            try {
                let res = await fetch(GAS_URL).then(r => r.json());
                globalSopir = res.sopir || []; globalKru = res.kru || []; globalArmada = res.armada || []; globalPesanan = res.pesanan || [];

                document.getElementById('loadingData').classList.add('hidden');

                if (globalPesanan.length > 1) {
                    for (let i = globalPesanan.length - 1; i >= 1; i--) buatKartuPesanan(globalPesanan[i]);
                } else document.getElementById('pesananKosong').classList.remove('hidden');

                renderDatabase(); renderKeuangan();
            } catch (err) { Swal.fire('Error', 'Gagal memuat data.', 'error'); }
        }

        function renderKeuangan() {
            let total = 0, selesai = 0, htmlRiwayat = '', mapPelanggan = new Map();
            for(let i=1; i<globalPesanan.length; i++) {
                let row = globalPesanan[i];
                let tarif = Number(row[11]) || 0; // Kolom L (11)
                let status = row[14] || "";       // Kolom O (14)
                let nama = row[2], wa = row[3];
                let tglRaw = new Date(row[1]); let tgl = isNaN(tglRaw) ? row[1] : tglRaw.toLocaleDateString('id-ID');

                if(nama && wa) {
                    let cWa = wa.toString().replace(/\D/g, '');
                    mapPelanggan.has(cWa) ? mapPelanggan.get(cWa).count++ : mapPelanggan.set(cWa, {nama:nama, count:1});
                }
                if(status.toLowerCase().includes('selesai')) {
                    total += tarif; selesai++;
                    htmlRiwayat += `<div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between"><div><p class="text-[10px] text-slate-500">${tgl} • ${row[0]}</p><p class="font-bold text-sm">${nama}</p></div><p class="font-black text-green-600">+ Rp ${tarif.toLocaleString('id-ID')}</p></div>`;
                }
            }
            document.getElementById('totalPendapatan').innerText = 'Rp ' + total.toLocaleString('id-ID');
            document.getElementById('totalOrderSelesai').innerText = selesai + ' Pesanan Selesai';
            document.getElementById('listRiwayatKeuangan').innerHTML = htmlRiwayat || '<p class="text-xs text-center mt-5 text-slate-400">Belum ada.</p>';

            let htmlPelanggan = '';
            mapPelanggan.forEach((val, key) => {
                htmlPelanggan += `<div class="bg-white p-4 rounded-xl border flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-black">${val.nama.charAt(0)}</div><div><p class="font-bold text-sm">${val.nama}</p><p class="text-[10px] text-slate-500">0${key}</p></div></div><div class="text-right"><p class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-md mb-1">${val.count}x Order</p><a href="https://wa.me/62${key}" target="_blank" class="text-[10px] text-green-700 bg-green-100 px-2 py-1 rounded-md inline-block">Chat</a></div></div>`;
            });
            document.getElementById('listPelanggan').innerHTML = htmlPelanggan || '<p class="text-sm text-center col-span-full">Belum ada pelanggan.</p>';
        }

        function renderDatabase() {
            const buatList = (arr, sheet) => arr.length <= 1 ? `<p class="text-xs text-center p-4 text-slate-400">Kosong</p>` : arr.slice(1).map(r => {
                let st = r[2] || 'Tersedia'; let bg = st==='Tersedia'?'bg-green-100 text-green-700':st==='Jalan'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700';
                return `<div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm"><div><p class="font-bold text-sm">${r[0]} <span class="${bg} text-[9px] px-1.5 rounded-md uppercase">${st}</span></p><p class="text-[10px]">${r[1]}</p></div><button onclick="hapusData('${sheet}','${r[0]}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white flex items-center justify-center"><i class="bi bi-trash"></i></button></div>`
            }).join('');
            document.getElementById('listSopir').innerHTML = buatList(globalSopir, 'Data_Sopir');
            document.getElementById('listKru').innerHTML = buatList(globalKru, 'Data_Kru');
            document.getElementById('listArmada').innerHTML = buatList(globalArmada, 'Data_Armada');
        }

        async function tambahData(sheet) {
            let p1 = sheet.includes('Armada') ? 'Plat Nomor' : 'Nama';
            let p2 = sheet.includes('Armada') ? 'Jenis Kendaraan' : 'No HP';
            const {value: form} = await Swal.fire({title: 'Tambah ' + sheet.replace('Data_',''), html: `<input id="swal-in1" class="swal2-input" placeholder="${p1}"><input id="swal-in2" class="swal2-input" placeholder="${p2}"><select id="swal-in3" class="swal2-input"><option value="Tersedia">Tersedia</option><option value="Jalan">Sedang Jalan</option><option value="Libur/Bengkel">Libur/Bengkel</option></select>`, preConfirm: () => [document.getElementById('swal-in1').value, document.getElementById('swal-in2').value, document.getElementById('swal-in3').value]});
            if(form && form[0]) {
                Swal.fire({title: 'Menyimpan...', didOpen: () => Swal.showLoading()});
                await fetch(GAS_URL, {method: 'POST', body: JSON.stringify({action: 'tambahData', payload: {sheet: sheet, rowData: form}})});
                muatDataPesanan();
                Swal.close();
            }
        }

        async function hapusData(sheet, id) {
            if((await Swal.fire({title: 'Hapus?', icon: 'warning', showCancelButton: true})).isConfirmed) {
                Swal.fire({title: 'Menghapus...', didOpen: () => Swal.showLoading()});
                await fetch(GAS_URL, {method: 'POST', body: JSON.stringify({action: 'hapusData', payload: {sheet: sheet, id: id}})});
                muatDataPesanan();
                Swal.close();
            }
        }

        function buatKartuPesanan(data) {
            const id = data[0], nm = data[2], wa = data[3], jmp = data[4], tjn = data[5], tarif = Number(data[11]||0), st = data[14]||'MENUNGGU', sS = data[16]||'', sK = data[17]||'', sA = data[18]||'';
            const tglRaw = new Date(data[1]); const wkt = isNaN(tglRaw) ? data[1] : tglRaw.toLocaleString('id-ID');
            let foto = (data[10] && data[10].includes('http')) ? `<button onclick="Swal.fire({imageUrl: '${data[10]}'})" class="text-[10px] bg-blue-50 text-blue-600 px-3 py-1.5 rounded font-black border border-blue-100">Foto</button>` : '';

            const genOpts = (arr, sel) => `<option value="">-Pilih-</option>` + (arr.length > 1 ? arr.slice(1).map(r => `<option value="${r[0]}" ${sel===r[0]?'selected':''}>${r[0]} ${r[2]?`(${r[2]})`:''}</option>`).join('') : '');

            let html = `
                <div class="bg-white p-5 rounded-2xl border relative shadow-sm">
                    <div class="flex justify-between border-b pb-3 mb-3">
                        <div><span class="bg-slate-100 text-xs px-2 py-1 rounded font-bold">${id}</span><h3 class="font-black mt-1">${nm}</h3><p class="text-xs text-green-600 font-bold">${wa}</p></div>
                        <div class="text-right"><p class="text-[10px] text-slate-400">${wkt}</p><p class="text-sm font-black text-green-600">Rp ${tarif.toLocaleString('id-ID')}</p></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="bg-blue-50 p-2 rounded-xl text-xs"><i class="bi bi-geo-alt-fill text-blue-500"></i> <span class="font-bold" title="${jmp}">${jmp.substring(0,25)}...</span></div>
                        <div class="bg-amber-50 p-2 rounded-xl text-xs"><i class="bi bi-flag-fill text-amber-500"></i> <span class="font-bold" title="${tjn}">${tjn.substring(0,25)}...</span></div>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-xl mb-3 flex justify-between items-center text-xs">
                        <p class="font-bold text-slate-700">${data[8]||'Tanpa catatan'} • ${data[9]||'-'}</p>${foto}
                    </div>
                    <div class="grid grid-cols-3 gap-2 mb-3">
                        <div><label class="text-[10px] font-bold text-slate-500">Sopir</label><select id="sopir-${id}" class="w-full bg-slate-50 border p-2 rounded text-xs font-bold">${genOpts(globalSopir, sS)}</select></div>
                        <div><label class="text-[10px] font-bold text-slate-500">Kru</label><select id="kru-${id}" class="w-full bg-slate-50 border p-2 rounded text-xs font-bold">${genOpts(globalKru, sK)}</select></div>
                        <div><label class="text-[10px] font-bold text-slate-500">Armada</label><select id="armada-${id}" class="w-full bg-slate-50 border p-2 rounded text-xs font-bold">${genOpts(globalArmada, sA)}</select></div>
                    </div>
                    <div class="flex gap-2">
                        <select id="status-${id}" class="flex-1 bg-slate-100 border p-2 rounded-xl text-sm font-black text-slate-700"><option value="MENUNGGU" ${st==='MENUNGGU'?'selected':''}>⏳ MENUNGGU</option><option value="Driver Menuju Lokasi" ${st==='Driver Menuju Lokasi'?'selected':''}>🚙 MELUNCUR</option><option value="Barang Diangkut" ${st==='Barang Diangkut'?'selected':''}>📦 JALAN</option><option value="Selesai" ${st==='Selesai'?'selected':''}>✅ SELESAI</option><option value="Batal" ${st==='Batal'?'selected':''}>❌ BATAL</option></select>
                        <button onclick="updateStatus('${id}')" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-black shadow text-sm">Simpan</button>
                    </div>
                </div>`;
            document.getElementById('daftarPesanan').insertAdjacentHTML('beforeend', html);
        }

        async function updateStatus(id) {
            Swal.fire({title: 'Menyimpan...', didOpen: () => Swal.showLoading()});
            await fetch(GAS_URL, {method: 'POST', body: JSON.stringify({action: 'updateStatus', payload: {id: id, status: document.getElementById(`status-${id}`).value, sopir: document.getElementById(`sopir-${id}`).value, kru: document.getElementById(`kru-${id}`).value, armada: document.getElementById(`armada-${id}`).value}})});
            muatDataPesanan(); Swal.close();
        }

        window.onload = muatDataPesanan;
    </script>
</body>
</html>
