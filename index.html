<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MazayaGo - Jasa Angkut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; margin: 0; overflow: hidden; }
        .app-container { width: 100%; height: 100vh; max-width: 480px; margin: 0 auto; background-color: #ffffff; position: relative; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
        #map { height: 100%; width: 100%; position: absolute; z-index: 0; }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; background: white; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; max-height: 85vh; transition: transform 0.3s; }
        .sheet-collapsed { transform: translateY(calc(100% - 50px)); }
        .modern-input { width: 100%; border: none; background: transparent; font-weight: 600; outline: none; font-size: 0.9rem; padding: 8px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="absolute top-0 left-0 right-0 z-10 p-4 pointer-events-none">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl p-3 flex justify-between items-center shadow-lg border border-white/50 pointer-events-auto">
            <div class="text-center pl-2 cursor-pointer" onclick="loginAdmin()">
                <h2 class="font-black text-[#0b192c] italic text-lg leading-none">MAZAYA<span class="text-[#ffb703]">GO</span></h2>
            </div>
            <button onclick="lacakPesanan()" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-md">
                <i class="bi bi-search font-bold text-lg"></i>
            </button>
        </div>
    </header>

    <div id="map"></div>
    
    <div id="camera" class="absolute inset-0 z-50 bg-black hidden flex-col">
        <video id="vid" class="w-full h-full object-cover" autoplay playsinline></video>
        <div class="absolute bottom-10 left-0 right-0 flex justify-center gap-5">
            <button onclick="tutupKamera()" class="w-14 h-14 bg-red-500 rounded-full text-white text-2xl"><i class="bi bi-x"></i></button>
            <button onclick="jepret()" class="w-16 h-16 bg-white rounded-full text-slate-800 text-3xl flex items-center justify-center shadow-xl"><i class="bi bi-camera-fill"></i></button>
        </div>
        <canvas id="canv" class="hidden"></canvas>
    </div>

    <div class="bottom-sheet" id="orderForm">
        <div class="w-full flex justify-center pt-3 pb-2 bg-white rounded-t-3xl cursor-pointer shrink-0" onclick="document.getElementById('orderForm').classList.toggle('sheet-collapsed')">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
        </div>

        <div class="px-5 pb-6 overflow-y-auto">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-4">
                <div class="flex items-center gap-3 mb-4 cursor-pointer" onclick="mode='jemput'">
                    <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-[10px] border-2 border-white"><i class="bi bi-geo-alt-fill"></i></div>
                    <div class="flex-1 border-b pb-2"><p class="text-[10px] font-bold text-slate-400">Jemput (Tap Peta)</p><input type="text" id="inJemput" class="modern-input" placeholder="Pilih..." readonly></div>
                </div>
                <div class="flex items-center gap-3 cursor-pointer" onclick="mode='tujuan'">
                    <div class="w-6 h-6 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-[10px] border-2 border-white"><i class="bi bi-flag-fill"></i></div>
                    <div class="flex-1"><p class="text-[10px] font-bold text-slate-400">Tujuan (Tap Peta)</p><input type="text" id="inTujuan" class="modern-input" placeholder="Pilih..." readonly></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center"><p class="text-[10px] font-bold text-slate-500">Jarak</p><p class="text-sm font-black text-slate-800" id="jarakT">0 Km</p></div>
                <div class="bg-green-50 p-3 rounded-xl border border-green-100 text-center"><p class="text-[10px] font-bold text-slate-500">Tarif</p><p class="text-sm font-black text-green-700" id="tarifT">Rp 0</p></div>
            </div>

            <div class="space-y-3 mb-5">
                <input type="text" id="nama" class="w-full border p-3 rounded-xl text-sm font-bold" placeholder="Nama Lengkap">
                <input type="tel" id="wa" class="w-full border p-3 rounded-xl text-sm font-bold" placeholder="Nomor WA (08...)">
                <select id="tenaga" onchange="hitung()" class="w-full border p-3 rounded-xl text-sm font-bold"><option value="Tanpa Kuli">Hanya Sewa Mobil</option><option value="Muatan Sedang">Tambah Kuli (Sedang)</option><option value="Muatan Berat">Tambah Kuli (Berat)</option></select>
                <textarea id="catatan" class="w-full border p-3 rounded-xl text-sm font-bold" placeholder="Catatan barang..."></textarea>
                <button onclick="bukaKamera()" class="w-full bg-slate-100 py-3 rounded-xl border font-bold flex justify-center items-center gap-2 text-slate-600"><i class="bi bi-camera"></i> <span id="txtFoto">Foto Barang (Opsional)</span></button>
            </div>

            <button onclick="pesan()" class="w-full bg-[#00B14F] text-white font-black py-4 rounded-2xl text-lg flex justify-center items-center gap-2">PESAN SEKARANG <i class="bi bi-arrow-right-circle-fill"></i></button>
        </div>
    </div>
</div>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsfSksKTUHNsbFR2wSDZRTynjyuhd_HPYOcb6-V8VbEAwWoyYOj9rdrFZAeROUa_LEGw/exec';
    
    let map, mkJ, mkT, rute, tj = null, tt = null, mode = 'jemput', km = 0, foto64 = "";
    
    window.onload = () => {
        map = L.map('map', {zoomControl: false}).setView([-7.9174, 113.8220], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        map.on('click', e => {
            if(mode === 'jemput') {
                if(mkJ) map.removeLayer(mkJ); tj = e.latlng;
                mkJ = L.marker(tj, {icon: L.divIcon({className:'', html:`<div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl border-2 border-white shadow"><i class="bi bi-geo-alt-fill"></i></div>`})}).addTo(map);
                document.getElementById('inJemput').value = `q=${tj.lat},${tj.lng}`; mode = 'tujuan';
            } else {
                if(mkT) map.removeLayer(mkT); tt = e.latlng;
                mkT = L.marker(tt, {icon: L.divIcon({className:'', html:`<div class="w-10 h-10 bg-red-600 text-white rounded-full flex items-center justify-center text-xl border-2 border-white shadow"><i class="bi bi-flag-fill"></i></div>`})}).addTo(map);
                document.getElementById('inTujuan').value = `q=${tt.lat},${tt.lng}`;
            }
            if(tj && tt) {
                if(rute) map.removeLayer(rute);
                km = (tj.distanceTo(tt) / 1000) * 1.3; document.getElementById('jarakT').innerText = km.toFixed(1) + ' Km';
                rute = L.polyline([tj, tt], {color: '#3b82f6', weight: 4}).addTo(map);
                map.fitBounds(rute.getBounds(), {padding: [50, 50]}); hitung();
            }
        });
    };

    function hitung() {
        if(km === 0) return; let h = 50000; if(km > 5) h += Math.ceil(km - 5) * 10000;
        let ten = document.getElementById('tenaga').value; if(ten==='Muatan Sedang') h+=50000; if(ten==='Muatan Berat') h+=100000;
        document.getElementById('tarifT').innerText = 'Rp ' + h.toLocaleString('id-ID');
    }

    let stream;
    async function bukaKamera() { document.getElementById('camera').classList.replace('hidden','flex'); stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); document.getElementById('vid').srcObject = stream; }
    function tutupKamera() { document.getElementById('camera').classList.replace('flex','hidden'); if(stream) stream.getTracks().forEach(t => t.stop()); }
    function jepret() { let v = document.getElementById('vid'), c = document.getElementById('canv'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); foto64 = c.toDataURL('image/jpeg', 0.5); document.getElementById('txtFoto').innerText="Foto Disimpan"; document.getElementById('txtFoto').classList.add('text-green-600'); tutupKamera(); }

    async function pesan() {
        let py = { nama: document.getElementById('nama').value, whatsapp: document.getElementById('wa').value, alamatJemput: document.getElementById('inJemput').value, alamatTujuan: document.getElementById('inTujuan').value, jarak: document.getElementById('jarakT').innerText, estimasi: Math.ceil(km*3)+' Mnt', keterangan: document.getElementById('catatan').value, opsiTenaga: document.getElementById('tenaga').value, totalTarif: document.getElementById('tarifT').innerText.replace(/\D/g,''), fotoBase64: foto64 };
        if(!py.nama || !py.whatsapp || !tj) return Swal.fire('Oops','Lengkapi data & Peta!','warning');
        Swal.fire({title:'Memproses...', didOpen:()=>Swal.showLoading()});
        await fetch(GAS_URL, {method:'POST', body:JSON.stringify({action:'saveOrder', payload:py})});
        Swal.fire('Berhasil','Pesanan dikirim!','success'); document.getElementById('orderForm').classList.add('sheet-collapsed');
    }

    async function lacakPesanan() {
        const {value: wa} = await Swal.fire({title: 'Lacak (No WA)', input: 'tel', showCancelButton: true});
        if(wa) {
            Swal.fire({title:'Mencari...', didOpen:()=>Swal.showLoading()});
            let res = await fetch(GAS_URL, {method:'POST', body:JSON.stringify({action:'cekStatus', payload:{wa:wa}})}).then(r=>r.json());
            Swal.fire({html: res.data.html});
            if(res.data.statusText.includes('Jalan') || res.data.statusText.includes('Menuju')) {
                document.getElementById('orderForm').classList.add('sheet-collapsed');
                if(rute) map.removeLayer(rute); rute = L.polyline([res.data.jemput, res.data.tujuan], {color:'#ffb703', weight:5}).addTo(map);
                let truk = L.marker(res.data.jemput, {icon: L.divIcon({className:'', html:`<div class="text-4xl text-[#0b192c] bg-white rounded-full p-2 border-2 border-[#ffb703]"><i class="bi bi-truck"></i></div>`})}).addTo(map);
                map.fitBounds(rute.getBounds()); setTimeout(() => { truk.setLatLng(res.data.tujuan); map.panTo(res.data.tujuan); }, 1500);
            }
        }
    }

    async function loginAdmin() {
        const {value: form} = await Swal.fire({title: 'Area Admin', html: '<input id="u" class="swal2-input" placeholder="User"><input id="p" type="password" class="swal2-input" placeholder="PIN">', preConfirm: () => [document.getElementById('u').value, document.getElementById('p').value]});
        if(form && form[0]==='Mazaya' && form[1]==='Sukses@01') window.location.href = 'admin.html';
        else if(form) Swal.fire('Ditolak','Data salah!','error');
    }
</script>
</body>
</html>
